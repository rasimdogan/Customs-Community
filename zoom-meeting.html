<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Customs Community · Zoom Canlı Sınıf</title>
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <script type="importmap">
    {"imports":{
      "react":"https://esm.sh/react@18.3.1",
      "react-dom":"https://esm.sh/react-dom@18.3.1?deps=react@18.3.1",
      "react-dom/client":"https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1"
    }}
  </script>
  <style>
    html,body{margin:0;min-height:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0e233b;color:#f2f8fd}
    *{box-sizing:border-box}
    #zoomEmbedRoot{width:100%;min-height:620px;height:100%;position:relative;overflow:hidden;background:#152b44}
    #zoomStatus{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:25px;z-index:2;background:#142941}
    #zoomStatus[hidden]{display:none}
    #zoomStatus div{max-width:500px}
    #zoomStatus h2{font-size:21px;line-height:1.4}
    #zoomStatus p{font-size:14px;color:#c6d9e8;line-height:1.6}
    #zoomHost{width:100%;min-height:620px;height:100%;position:relative;overflow:hidden}
    .meeting-app{height:100%}
    @media(max-width:680px){#zoomEmbedRoot,#zoomHost{min-height:570px}#zoomStatus h2{font-size:17px}}
  </style>
</head>
<body>
  <main id="zoomEmbedRoot">
    <div id="zoomStatus" role="status"><div><h2>Zoom oturumu hazırlanıyor</h2><p>Customs Community üzerinden güvenli bağlantı bekleniyor.</p></div></div>
    <div id="zoomHost"></div>
  </main>
  <script type="module">
    // This route deliberately contains no Supabase secrets or Zoom credentials.
    // Signature and meeting details arrive only from the authorized parent.
    const state=document.getElementById('zoomStatus');
    const note=(heading,detail)=>{
      state.hidden=false;
      const wrap=state.firstElementChild;
      wrap.replaceChildren();
      const h=document.createElement('h2'),p=document.createElement('p');
      h.textContent=heading;p.textContent=detail;
      wrap.append(h,p);
    };
    const report=(event,error='')=>window.parent.postMessage({type:'cc-zoom-status',event,error},window.location.origin);
    let client=null,joining=false;
    window.addEventListener('message',async ev=>{
      if(ev.origin!==window.location.origin||ev.source!==window.parent)return;
      const data=ev.data||{};
      if(data.type==='cc-zoom-reset'){
        if(client){try{await client.leaveMeeting()}catch{}}
        client=null;joining=false;
        document.getElementById('zoomHost').replaceChildren();
        note('Zoom toplantısı kapatıldı','Yeniden bağlanmak için sınıf ekranındaki bağlantı düğmesini kullanın.');
        return;
      }
      if(data.type!=='cc-zoom-join'||joining)return;
      if(!data.signature||!/^\d{9,11}$/.test(String(data.meetingNumber||''))){
        report('error','Zoom toplantı bilgileri eksik.');return
      }
      joining=true;
      note('Zoom yükleniyor','Toplantı bileşenleri indiriliyor. Kamera ve mikrofon izni istenebilir.');
      try{
        const module=await import('https://source.zoom.us/6.10.0/esm/component-view.es.min.js');
        const ZoomMtgEmbedded=module.default;
        if(!ZoomMtgEmbedded?.createClient)throw Error('Zoom bileşeni yüklenemedi.');
        client=ZoomMtgEmbedded.createClient();
        await client.init({zoomAppRoot:document.getElementById('zoomHost'),language:'tr-TR',patchJsMedia:true});
        state.hidden=true;
        await client.join({
          signature:data.signature,
          meetingNumber:String(data.meetingNumber),
          password:String(data.password||''),
          userName:String(data.userName||'Katılımcı').slice(0,80)
        });
        report('joined');
      }catch(err){
        const message=String(err?.message||err||'Zoom toplantısı başlatılamadı.');
        note('Zoom toplantısına bağlanılamadı',message+'. Toplantı sahibi Zoom uygulamasında görüşmeyi başlatmış olmalıdır.');
        report('error',message);
        joining=false;
      }
    });
    report('ready');
  </script>
</body>
</html>
