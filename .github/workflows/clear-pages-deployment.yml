name: Clear stuck GitHub Pages deployment

on:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write

jobs:
  clear-stuck-deployment:
    if: contains(github.event.issue.title, 'CC Pages bakım kilidi')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BUILD_VERSION: 07960fd09b3ca0681cb0a9e91e00777686a7268d
        run: |
          set -euo pipefail
          echo "Requesting cancellation of stale Pages deployment: $BUILD_VERSION"
          code=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER/$REPO/pages/deployments/$BUILD_VERSION/cancel")
          cat response.json
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "Cancellation request accepted (HTTP $code)."
          else
            echo "Cancellation request failed (HTTP $code)." >&2
            exit 1
          fi
