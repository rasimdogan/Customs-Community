name: Clear stuck GitHub Pages deployment

on:
  issues:
    types: [opened]

permissions:
  contents: read
  pages: write
  actions: write

jobs:
  clear-stuck-deployment:
    if: contains(github.event.issue.title, 'CC Pages bakım kilidi')
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment and obsolete queued run
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BUILD_VERSION: 07960fd09b3ca0681cb0a9e91e00777686a7268d
          OLD_RUN_ID: 42091860593
        run: |
          set -euo pipefail
          echo "Cancel stale Pages deployment: $BUILD_VERSION"
          code=$(curl -sS -o /tmp/pages-cancel.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER/$REPO/pages/deployments/$BUILD_VERSION/cancel")
          cat /tmp/pages-cancel.json
          test "$code" -ge 200 && test "$code" -lt 300
          echo "Cancel obsolete queued Pages workflow run: $OLD_RUN_ID"
          run_code=$(curl -sS -o /tmp/run-cancel.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/runs/$OLD_RUN_ID/cancel")
          cat /tmp/run-cancel.json
          if [ "$run_code" -ge 200 ] && [ "$run_code" -lt 300 ]; then
            echo "Queued run cancellation accepted (HTTP $run_code)."
          else
            echo "Queued run cancellation returned HTTP $run_code; continuing."
          fi
